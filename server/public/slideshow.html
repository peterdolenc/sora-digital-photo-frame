<!DOCTYPE html>
<html lang="en" class="dark" data-interval="15000">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1117">
    <!-- Opened from the home screen, the frame runs full screen with no browser chrome -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sora">
    <title data-i18n="slideshow.pageTitle">Sora Frame</title>
    <link rel="icon" href="/icons/favicon.ico" sizes="48x48">
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/icons/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/css/sora.css">
    <link rel="stylesheet" href="/css/i18n.css">

    <link rel="stylesheet" href="/css/slideshow.css">
    <link rel="stylesheet" href="/css/notePage.css">
</head>

<body>
    <!-- Slideshow Container -->
    <div class="slideshow-container" id="slideshowContainer">
        <!-- Photo Slides -->
        <div class="slide" id="slide1">
            <div class="slide-ambient"></div>
            <img id="image1" alt="">
        </div>

        <div class="slide" id="slide2">
            <div class="slide-ambient"></div>
            <img id="image2" alt="">
        </div>

        <!-- Note pages (Notes) fade in over the photos every few minutes -->
        <div class="note-stage note-layer" id="noteLayer" aria-live="polite"></div>

        <div class="stage-scrim" aria-hidden="true"></div>

        <!-- Loading State -->
        <div class="stage-state" id="loadingState">
            <span class="sora-wordmark">Sora</span>
            <div class="developing-line"></div>
            <p class="developing" data-i18n="slideshow.developing">Developing your photos</p>
        </div>

        <!-- Error State -->
        <div class="stage-state hidden" id="errorState">
            <div class="error-card" role="alert">
                <span class="material-icons">photo_library</span>
                <h2 data-i18n="slideshow.nothing">Nothing to show yet</h2>
                <p id="errorMessage" data-i18n="slideshow.unable_images">Unable to load images. Please check your connection.</p>
                <a href="/login" data-i18n="slideshow.open_library">Open the library &rarr;</a>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-bar" id="progressBar"></div>

        <div class="paused-badge" aria-hidden="true" data-i18n="slideshow.paused">Paused</div>

        <!-- Controls -->
        <div class="controls" id="controls">
            <button class="dock-btn primary" id="playPauseBtn" aria-label="Pause slideshow" title="Pause (Space)" data-i18n-attr="aria-label:slideshow.static_009; title:slideshow.static_010">
                <span class="material-icons">pause</span>
            </button>
            <button class="dock-btn" id="nextBtn" aria-label="Next photo" title="Next photo (N)" data-i18n-attr="aria-label:slideshow.static_011; title:slideshow.static_012">
                <span class="material-icons">skip_next</span>
            </button>

            <span class="dock-divider" aria-hidden="true"></span>

            <div id="folderSelector">
                <!-- Folder selector will be initialized here -->
            </div>

            <span class="dock-divider" aria-hidden="true"></span>

            <button class="dock-btn" id="infoBtn" aria-label="Photo details" title="Photo details (I)" data-i18n-attr="aria-label:slideshow.static_013; title:slideshow.static_014">
                <span class="material-icons">info</span>
            </button>
            <button class="dock-btn" id="fullscreenBtn" aria-label="Toggle fullscreen" title="Fullscreen (F)" data-i18n-attr="aria-label:slideshow.static_015; title:slideshow.static_016">
                <span class="material-icons">fullscreen</span>
            </button>
            <button class="dock-btn" id="languageBtn" aria-label="Language" title="Language" data-i18n-attr="aria-label:slideshow.static_017; title:slideshow.static_018">
                <span class="material-icons">language</span>
            </button>
        </div>

        <!-- Weather and Clock Widget -->
        <div class="weather-widget" id="weatherWidget">
            <div class="time-section">
                <div class="time-display" id="timeDisplay">--:--</div>
                <div class="date-display" id="dateDisplay">&nbsp;</div>
            </div>
            <div class="weather-display">
                <span class="weather-icon material-icons" id="weatherIcon">wb_sunny</span>
                <span id="tempDisplay">--°</span>
            </div>
        </div>

        <!-- Where and when the photo was taken -->
        <div class="photo-caption" id="photoCaption" aria-live="polite">
            <div class="caption-date" id="captionDate"></div>
            <div class="caption-place" id="captionPlace"></div>
            <div class="caption-file" id="captionFile"></div>
        </div>

        <div class="caption-caption" id="captionCaption"></div>

        <!-- Info Overlay -->
        <div class="info-overlay hidden" id="infoOverlay">
            <div id="infoCamera"></div>
            <div id="infoLens"></div>
            <div id="infoExposure"></div>
        </div>
    </div>

    <dialog id="languageModal" class="dialog" aria-labelledby="languageTitle">
        <article><header><h2 id="languageTitle" data-i18n="common.language">Language</h2></header>
        <section><label for="frameLanguage" data-i18n="accessAccounts.screen_language">Frame language</label>
        <select id="frameLanguage" class="input"></select></section>
        <footer><button id="closeLanguage" class="btn-outline" data-i18n="common.close">Close</button></footer></article>
    </dialog>

    <!-- Load folder selection scripts -->
    <script src="/js/i18n.js"></script>
    <script src="/js/folderService.js"></script>
    <script src="/js/folderStorage.js"></script>
    <script src="/js/folderSelector.js"></script>
    <script src="/js/keepAwake.js"></script>

    <script src="/js/notePage.js"></script>
    <script src="/js/noteScheduler.js"></script>
    <script src="/js/slideshow.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const modal = document.getElementById('languageModal');
        const select = document.getElementById('frameLanguage');
        const fill = () => { select.innerHTML = i18n.supported.map(code => `<option value="${code}">${i18n.names[code]}</option>`).join(''); select.value = i18n.locale; };
        fill(); window.addEventListener('sora:languagechange', fill);
        document.getElementById('languageBtn').onclick = () => modal.showModal();
        document.getElementById('closeLanguage').onclick = () => modal.close();
        select.onchange = async () => { await i18n.setLanguage(select.value, false); };
      });
    </script>
</body>

</html>
